<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramenta de Captura de Leads</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Ferramenta de Captura de Leads</h1>
      <p class="subtitle">Encontre leads comerciais no Google Maps</p>
    </header>

    <main>
      <section class="form-section">
        <form id="lead-form">
          <div class="form-group">
            <label for="niche">Nicho / Setor de Negócio</label>
            <input
              type="text"
              id="niche"
              name="niche"
              placeholder="ex: encanadores, dentistas, restaurantes"
              required
            >
          </div>

          <div class="form-group">
            <label for="keywords">Palavras-chave Adicionais (opcional)</label>
            <input
              type="text"
              id="keywords"
              name="keywords"
              placeholder="ex: emergência, 24h, acessível"
            >
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="city">Cidade</label>
              <input
                type="text"
                id="city"
                name="city"
                placeholder="ex: São Paulo"
              >
            </div>

            <div class="form-group">
              <label for="state">Estado / Região</label>
              <input
                type="text"
                id="state"
                name="state"
                placeholder="ex: São Paulo"
              >
            </div>

            <div class="form-group">
              <label for="country">País</label>
              <input
                type="text"
                id="country"
                name="country"
                placeholder="ex: Brasil"
                value="Brasil"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="quantity">Número de Leads: <span id="quantity-value">10</span></label>
            <input
              type="range"
              id="quantity"
              name="quantity"
              min="10"
              max="50"
              value="10"
            >
            <div class="range-labels">
              <span>10</span>
              <span>50</span>
            </div>
          </div>

          <button type="submit" id="generate-btn">Gerar Leads</button>
        </form>
      </section>

      <section class="progress-section" id="progress-section" hidden>
        <h2>Progresso</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <p class="progress-text" id="progress-text">Inicializando...</p>
        <p class="progress-count" id="progress-count">0 leads encontrados</p>
      </section>

      <section class="results-section" id="results-section" hidden>
        <div class="results-header">
          <h2>Resultados</h2>
          <button id="export-btn" class="export-btn">Exportar CSV</button>
        </div>

        <div class="table-container">
          <table id="results-table">
            <thead>
              <tr>
                <th>Nome</th>
                <th>E-mail</th>
                <th>Telefone</th>
                <th>Site</th>
                <th>Endereço</th>
                <th>Avaliação</th>
              </tr>
            </thead>
            <tbody id="results-body">
            </tbody>
          </table>
        </div>
      </section>

      <section class="error-section" id="error-section" hidden>
        <div class="error-message" id="error-message"></div>
      </section>
    </main>
  </div>

  <script src="/js/api-client.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
